<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Thika Auto .dz — سوق السيارات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',Tahoma,sans-serif
}

body{
  background:#f8fafc;
  color:#1e293b
}

[dir="ltr"] body{text-align:left}
[dir="rtl"] body{text-align:right}

header{
  background:#0f172a;
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  position:sticky;
  top:0;
  z-index:50
}

header h1{
  font-size:19px
}

header h1 span{
  color:#facc15
}

.btn{
  background:#facc15;
  color:#0f172a;
  border:none;
  padding:9px 16px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  font-size:13px
}

.btn:hover{
  opacity:.92
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.btn-outline{
  background:transparent;
  color:#fff;
  border:1.5px solid #334155
}

.btn-delete{
  background:#fee2e2;
  color:#b91c1c;
  border:1px solid #fecaca
}

.header-actions{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap
}

.user-chip{
  background:#1e293b;
  padding:6px 12px;
  border-radius:20px;
  font-size:11px
}

.lang-switcher{
  display:flex;
  gap:6px
}

.lang-switcher button{
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:8px;
  padding:5px 9px;
  cursor:pointer;
  font-weight:700;
  font-size:12px
}

.flag-icon{
  display:block;
  width:30px;
  height:20px;
  border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.18);
  position:relative;
  overflow:hidden;
}
.flag-dz{
  background:linear-gradient(90deg,#006233 0 50%,#fff 50% 100%);
}
.flag-dz::before{
  content:"";
  position:absolute;
  width:9px;
  height:9px;
  left:12px;
  top:5px;
  border:2px solid #d21034;
  border-radius:50%;
  border-left-color:transparent;
  transform:rotate(-18deg);
}
.flag-dz::after{
  content:"★";
  position:absolute;
  left:14px;
  top:3px;
  color:#d21034;
  font-size:9px;
  line-height:14px;
}
.flag-fr{
  background:linear-gradient(90deg,#0055a4 0 33.333%,#fff 33.333% 66.666%,#ef4135 66.666% 100%);
}
.flag-gb{
  background:#012169;
}
.flag-gb::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 43%,#fff 43% 57%,transparent 57%),
    linear-gradient(0deg,transparent 35%,#fff 35% 65%,transparent 65%),
    linear-gradient(45deg,transparent 43%,#fff 43% 57%,transparent 57%),
    linear-gradient(-45deg,transparent 43%,#fff 43% 57%,transparent 57%);
}
.flag-gb::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 47%,#c8102e 47% 53%,transparent 53%),
    linear-gradient(0deg,transparent 40%,#c8102e 40% 60%,transparent 60%);
}

.lang-switcher button.active{
  background:#facc15;
  border-color:#facc15
}

.trust-bar{
  background:#f0fdf4;
  padding:8px 16px;
  display:flex;
  gap:14px;
  overflow:auto;
  font-size:11px;
  color:#166534;
  border-bottom:1px solid #bbf7d0
}

.trust-bar span{
  white-space:nowrap;
  font-weight:700
}

.hero{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:#fff;
  padding:30px 16px;
  text-align:center
}

.filters{
  background:#fff;
  padding:12px 16px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  border-bottom:1px solid #e2e8f0
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
  padding:16px
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  border:2px solid #e2e8f0;
  position:relative
}

.card.featured{
  border-color:#facc15;
  box-shadow:0 5px 22px rgba(250,204,21,.25)
}

.card img{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#e2e8f0
}

.card-body{
  padding:12px
}

.price{
  color:#16a34a;
  font-weight:900;
  font-size:17px
}

.meta{
  color:#64748b;
  font-size:11px;
  margin:3px 0
}

.badge{
  padding:3px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  display:inline-block;
  margin:2px;
  background:#dbeafe;
  color:#1e40af
}

.featured-badge{
  position:absolute;
  top:10px;
  inset-inline-start:10px;
  background:#facc15;
  color:#0f172a;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  z-index:2
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  padding:12px
}

.modal.active{
  display:flex
}

.modal-box{
  background:#fff;
  border-radius:18px;
  padding:22px;
  width:100%;
  max-width:440px;
  max-height:92vh;
  overflow:auto;
  position:relative
}

.close-x{
  position:absolute;
  top:12px;
  inset-inline-end:12px;
  background:#f1f5f9;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer
}

.input{
  width:100%;
  padding:12px;
  border:1.5px solid #cbd5e1;
  border-radius:10px;
  margin:7px 0;
  font-size:13px;
  background:#fff
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.note{
  background:#f0fdf4;
  border:1.5px solid #22c55e;
  border-radius:12px;
  padding:10px;
  margin:8px 0;
  font-size:11px
}

.pl{
  white-space:pre-line;
  font-size:12px;
  line-height:1.8
}

.chat-container{
  display:flex;
  flex-direction:column;
  height:460px
}

.chat-messages{
  flex:1;
  overflow:auto;
  padding:10px;
  background:#f1f5f9;
  border-radius:14px;
  margin-bottom:8px;
  display:flex;
  flex-direction:column;
  border:2px solid #e2e8f0
}

.msg{
  padding:10px 12px;
  border-radius:14px;
  margin:5px 0;
  max-width:82%;
  font-size:12px;
  word-break:break-word
}

.msg.other{
  background:#fff;
  border:1px solid #e2e8f0;
  align-self:flex-start
}

.msg.me{
  background:#0f172a;
  color:#fff;
  align-self:flex-end
}

.msg.system{
  background:#dcfce7;
  color:#166534;
  align-self:center;
  font-size:10px;
  text-align:center
}

.page{
  max-width:900px;
  margin:0 auto;
  padding:18px
}

.box{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  border:2px solid #e2e8f0
}

footer{
  background:#0f172a;
  color:#fff;
  padding:26px 16px 18px;
  margin-top:20px;
  font-size:12px
}
</style>
</head>

<body>

<header>
  <h1>🚗 <span>Thika Auto</span> .dz</h1>
  <div class="header-actions" id="headerActions">
    <button class="btn btn-outline" onclick="openModal('loginModal')">تسجيل الدخول</button>
  </div>

  <div class="lang-switcher" aria-label="Language">
    <button type="button" data-lang="ar" onclick="setLanguage('ar')"><span class="flag-icon flag-dz"></span></button>
    <button type="button" data-lang="fr" onclick="setLanguage('fr')"><span class="flag-icon flag-fr"></span></button>
    <button type="button" data-lang="en" onclick="setLanguage('en')"><span class="flag-icon flag-gb"></span></button>
  </div>
</header>

<div class="trust-bar">
  <span data-i18n="trust1"></span>
  <span data-i18n="trust2"></span>
  <span data-i18n="trust3"></span>
</div>

<!-- ================= HOME ================= -->
<div id="homePage" class="view">
  <div class="hero">
    <h2 style="font-size:20px" data-i18n="heroTitle"></h2>
    <p style="font-size:12px;margin-top:6px;opacity:.9" data-i18n="heroText"></p>
    <p id="status" style="margin-top:10px;font-size:11px;opacity:.75" data-i18n="loading"></p>
  </div>

  <!-- الفلاتر المتقدمة المدمجة -->
  <div class="filters">
    <select id="filterCategory" class="input" style="margin:0; min-width:140px" onchange="applyFilters()">
      <option value="">كل الفئات</option>
      <option value="سياحية">سياحية</option>
      <option value="نفعية">نفعية</option>
      <option value="فاخرة">فاخرة</option>
    </select>

    <select id="filterWilaya" class="input" style="margin:0; min-width:140px" onchange="applyFilters()">
      <option value="">كل الولاية</option>
      <option value="الجزائر">الجزائر</option>
      <option value="وهران">وهران</option>
      <option value="قسنطينة">قسنطينة</option>
      <option value="عنابة">عنابة</option>
    </select>

    <input id="filterSearch" class="input" type="search" placeholder="ابحث عن ماركة، موديل..." style="margin:0; flex:1; min-width:140px" oninput="applyFilters()">

    <!-- نطاق السعر -->
    <input id="filterMinPrice" class="input" type="number" placeholder="أقل سعر (دج)" style="margin:0; width:115px" oninput="applyFilters()">
    <input id="filterMaxPrice" class="input" type="number" placeholder="أعلى سعر (دج)" style="margin:0; width:115px" oninput="applyFilters()">

    <!-- نطاق سنة الصنع -->
    <input id="filterMinYear" class="input" type="number" placeholder="من سنة" style="margin:0; width:85px" oninput="applyFilters()">
    <input id="filterMaxYear" class="input" type="number" placeholder="إلى سنة" style="margin:0; width:85px" oninput="applyFilters()">

    <!-- المسافة المقطوعة -->
    <input id="filterMaxMileage" class="input" type="number" placeholder="أقصى كم" style="margin:0; width:100px" oninput="applyFilters()">

    <button class="btn" onclick="applyFilters()" style="white-space:nowrap" data-i18n="filter">بحث وتصفية</button>
  </div>

  <p style="padding:8px 16px;text-align:center;color:#64748b;font-size:11px" data-i18n="ownerHelp"></p>

  <div class="grid" id="carsGrid"></div>
</div>

<!-- ================= LOGIN MODAL ================= -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <button class="close-x" onclick="closeModal('loginModal')">✕</button>
    <h3 data-i18n="loginTitle">تسجيل الدخول</h3>
    <input class="input" id="loginEmail" type="email" placeholder="البريد الإلكتروني">
    <input class="input" id="loginPassword" type="password" placeholder="كلمة المرور">
    <button class="btn" onclick="doLogin()" style="width:100%;padding:12px;margin-top:8px">دخول</button>
  </div>
</div>

<script>
// ==========================================
// THIKA AUTO .DZ — APP LOGIC & FILTERS
// ==========================================

const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentLang = 'ar';
let allCars = [
  // بيانات تجريبية لاختبار الفلاتر فوراً
  { id: 1, brand: 'Renault', model: 'Clio 4', year: 2019, price: 2600000, mileage: 75000, wilaya: 'الجزائر', category: 'سياحية', fuel: 'ديزل', gearbox: 'يدوي', is_featured: true, image_url: '' },
  { id: 2, brand: 'Toyota', model: 'Hilux', year: 2022, price: 6500000, mileage: 30000, wilaya: 'وهران', category: 'نفعية', fuel: 'ديزل', gearbox: 'أوتوماتيك', is_featured: false, image_url: '' },
  { id: 3, brand: 'Hyundai', model: 'Accent', year: 2017, price: 2100000, mileage: 120000, wilaya: 'قسنطينة', category: 'سياحية', fuel: 'بنزين', gearbox: 'يدوي', is_featured: false, image_url: '' }
];
let filteredCars = [];

const translations = {
  ar: {
    trust1: "🔒 منصة موثوقة للسيارات في الجزائر",
    trust2: "🚗 إعلانات معتمدة وفحص دوري",
    trust3: "📞 دعم فني متواصل",
    heroTitle: "سوق السيارات المستعملة والجديدة في الجزائر",
    heroText: "تصفح آلاف السيارات، تواصل مباشرة مع البائعين، واعرض سيارتك بكل سهولة.",
    loading: "جاري تحميل الإعلانات...",
    filter: "بحث وتصفية",
    ownerHelp: "استخدم الفلاتر المتقدمة أعلاه لتصفية النتائج بدقة وسرعة.",
    loginTitle: "تسجيل الدخول"
  },
  fr: {
    trust1: "🔒 Plateforme automobile de confiance en Algérie",
    trust2: "🚗 Annonces vérifiées et inspection régulière",
    trust3: "📞 Support technique continu",
    heroTitle: "Marché des voitures neuves et d'occasion en Algérie",
    heroText: "Parcourez des milliers de véhicules et contactez directement les vendeurs.",
    loading: "Chargement des annonces...",
    filter: "Filtrer",
    ownerHelp: "Utilisez les filtres avancés ci-dessus pour affiner votre recherche.",
    loginTitle: "Connexion"
  },
  en: {
    trust1: "🔒 Trusted Automotive Platform in Algeria",
    trust2: "🚗 Verified listings & inspections",
    trust3: "📞 Continuous support",
    heroTitle: "New & Used Car Market in Algeria",
    heroText: "Browse thousands of vehicles and connect directly with sellers.",
    loading: "Loading listings...",
    filter: "Filter",
    ownerHelp: "Use the advanced filters above to find your ideal car.",
    loginTitle: "Login"
  }
};

function setLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

  document.querySelectorAll('.lang-switcher button').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) {
      el.textContent = translations[lang][key];
    }
  });
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// دالة الفلاتر المتقدمة المطورة
function applyFilters() {
  const category = document.getElementById('filterCategory').value;
  const wilaya = document.getElementById('filterWilaya').value;
  const search = document.getElementById('filterSearch').value.toLowerCase().trim();
  
  const minPrice = parseFloat(document.getElementById('filterMinPrice').value) || 0;
  const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value) || Infinity;
  
  const minYear = parseInt(document.getElementById('filterMinYear').value) || 0;
  const maxYear = parseInt(document.getElementById('filterMaxYear').value) || Infinity;
  
  const maxMileage = parseFloat(document.getElementById('filterMaxMileage').value) || Infinity;

  filteredCars = allCars.filter(car => {
    const matchCategory = !category || car.category === category;
    const matchWilaya = !wilaya || car.wilaya === wilaya;
    const matchSearch = !search || 
      car.brand.toLowerCase().includes(search) || 
      car.model.toLowerCase().includes(search);
    
    const matchPrice = car.price >= minPrice && car.price <= maxPrice;
    const matchYear = car.year >= minYear && car.year <= maxYear;
    const matchMileage = car.mileage <= maxMileage;

    return matchCategory && matchWilaya && matchSearch && matchPrice && matchYear && matchMileage;
  });

  renderCarsGrid(filteredCars);
}

function renderCarsGrid(carsToRender) {
  const grid = document.getElementById('carsGrid');
  if (!carsToRender || carsToRender.length === 0) {
    grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#64748b; padding:20px;">لا توجد سيارات مطابقة لخيارات البحث المتقدمة.</p>`;
    return;
  }

  grid.innerHTML = carsToRender.map(car => `
    <div class="card ${car.is_featured ? 'featured' : ''}">
      ${car.is_featured ? '<div class="featured-badge">⭐ مميز</div>' : ''}
      <img src="${car.image_url || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=600&q=80'}" alt="${car.brand}">
      <div class="card-body">
        <div class="price">${car.price.toLocaleString()} دج</div>
        <h4 style="font-size:15px; margin:4px 0">${car.brand} ${car.model}</h4>
        <div class="meta">📅 ${car.year} | 🛣️ ${car.mileage ? car.mileage.toLocaleString() : '0'} كم | 📍 ${car.wilaya}</div>
        <div style="margin-top:8px">
          <span class="badge">${car.fuel || 'بنزين'}</span>
          <span class="badge">${car.gearbox || 'يدوي'}</span>
        </div>
        <button class="btn" style="width:100%; margin-top:10px; font-size:12px;" onclick="alert('فتح محادثة السيارة رقم: ${car.id}')">تواصل مع البائع</button>
      </div>
    </div>
  `).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  setLanguage('ar');
  filteredCars = [...allCars];
  renderCarsGrid(filteredCars);
});
</script>

</body>
</html>
