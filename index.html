<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Thika Auto .dz — سوق السيارات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',Tahoma,sans-serif
}

body{
  background:#f8fafc;
  color:#1e293b
}

[dir="ltr"] body{text-align:left}
[dir="rtl"] body{text-align:right}

header{
  background:#0f172a;
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  position:sticky;
  top:0;
  z-index:50
}

header h1{
  font-size:19px
}

header h1 span{
  color:#facc15
}

.btn{
  background:#facc15;
  color:#0f172a;
  border:none;
  padding:9px 16px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  font-size:13px
}

.btn:hover{
  opacity:.92
}

.btn-outline{
  background:transparent;
  color:#fff;
  border:1.5px solid #334155
}

.header-actions{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap
}

.lang-switcher{
  display:flex;
  gap:6px
}

.lang-switcher button{
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:8px;
  padding:5px 9px;
  cursor:pointer;
  font-weight:700;
  font-size:12px
}

.lang-switcher button.active{
  background:#facc15;
  border-color:#facc15
}

.trust-bar{
  background:#f0fdf4;
  padding:8px 16px;
  display:flex;
  gap:14px;
  overflow:auto;
  font-size:11px;
  color:#166534;
  border-bottom:1px solid #bbf7d0
}

.hero{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:#fff;
  padding:30px 16px;
  text-align:center
}

.filters{
  background:#fff;
  padding:12px 16px;
  display:flex;
  gap:8px;
  overflow:auto;
  border-bottom:1px solid #e2e8f0;
  flex-wrap:wrap;
  align-items:center
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
  padding:16px
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  border:2px solid #e2e8f0;
  position:relative
}

.card.featured{
  border-color:#facc15;
  box-shadow:0 5px 22px rgba(250,204,21,.25)
}

.card img{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#e2e8f0
}

.card-body{
  padding:12px
}

.price{
  color:#16a34a;
  font-weight:900;
  font-size:17px
}

.meta{
  color:#64748b;
  font-size:11px;
  margin:3px 0
}

.badge{
  padding:3px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  display:inline-block;
  margin:2px;
  background:#dbeafe;
  color:#1e40af
}

.featured-badge{
  position:absolute;
  top:10px;
  inset-inline-start:10px;
  background:#facc15;
  color:#0f172a;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  z-index:2
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  padding:12px
}

.modal.active{
  display:flex
}

.modal-box{
  background:#fff;
  border-radius:18px;
  padding:22px;
  width:100%;
  max-width:440px;
  max-height:92vh;
  overflow:auto;
  position:relative
}

.close-x{
  position:absolute;
  top:12px;
  inset-inline-end:12px;
  background:#f1f5f9;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer
}

.input{
  width:100%;
  padding:12px;
  border:1.5px solid #cbd5e1;
  border-radius:10px;
  margin:7px 0;
  font-size:13px;
  background:#fff
}

.box{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  border:2px solid #e2e8f0;
  max-width:600px;
  margin:20px auto
}
</style>
</head>

<body>

<header>
  <h1>🚗 <span>Thika Auto</span> .dz</h1>
  <div class="header-actions">
    <button class="btn" onclick="openModal('addCarModal')">إضافة سيارة</button>
    <button class="btn btn-outline" onclick="openModal('loginModal')">تسجيل الدخول</button>
  </div>
</header>

<div class="trust-bar">
  <span>🔒 منصة موثوقة للسيارات في الجزائر</span>
  <span>🚗 إعلانات معتمدة وفحص دوري</span>
  <span>📞 دعم فني متواصل</span>
</div>

<div class="hero">
  <h2 style="font-size:20px">سوق السيارات المستعملة والجديدة في الجزائر</h2>
  <p style="font-size:12px;margin-top:6px;opacity:.9">تصفح آلاف السيارات، تواصل مباشرة مع البائعين، واعرض سيارتك بكل سهولة.</p>
</div>

<!-- قسم الفلاتر المتقدمة -->
<div class="filters">
  <select id="filterCategory" class="input" style="margin:0; width:150px;" onchange="applyFilters()">
    <option value="">كل الفئات</option>
    <option value="سياحية">سياحية</option>
    <option value="نفعية">نفعية</option>
    <option value="فاخرة">فاخرة</option>
  </select>

  <select id="filterWilaya" class="input" style="margin:0; width:150px;" onchange="applyFilters()">
    <option value="">كل الولاية</option>
    <option value="الجزائر">الجزائر</option>
    <option value="وهران">وهران</option>
    <option value="قسنطينة">قسنطينة</option>
    <option value="عنابة">عنابة</option>
  </select>

  <input id="filterSearch" class="input" type="search" placeholder="ابحث عن ماركة، موديل..." style="margin:0; flex:1; min-width:160px;" oninput="applyFilters()">

  <input id="filterMinPrice" class="input" type="number" placeholder="أقل سعر (دج)" style="margin:0; width:125px;" oninput="applyFilters()">
  <input id="filterMaxPrice" class="input" type="number" placeholder="أعلى سعر (دج)" style="margin:0; width:125px;" oninput="applyFilters()">

  <button class="btn" onclick="applyFilters()" style="white-space:nowrap; padding:12px 18px;">بحث وتصفية</button>
</div>

<!-- شبكة عرض السيارات -->
<div class="grid" id="carsGrid"></div>

<!-- نموذج إضافة سيارة مع رفع الصور -->
<div class="modal" id="addCarModal">
  <div class="modal-box">
    <button class="close-x" onclick="closeModal('addCarModal')">✕</button>
    <h3>إضافة إعلان سيارة جديدة</h3>
    <input class="input" id="carBrand" type="text" placeholder="الماركة (مثال: Renault)">
    <input class="input" id="carModel" type="text" placeholder="الموديل (مثال: Clio 4)">
    <input class="input" id="carPrice" type="number" placeholder="السعر (دج)">
    
    <label style="font-size:12px; font-weight:700; color:#475569; display:block; margin-top:8px;">صورة السيارة:</label>
    <input class="input" id="carImageFile" type="file" accept="image/*" style="padding:8px;">

    <button class="btn" onclick="addCar()" style="width:100%; margin-top:12px;">نشر الإعلان</button>
  </div>
</div>

<!-- نافذة تسجيل الدخول -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <button class="close-x" onclick="closeModal('loginModal')">✕</button>
    <h3>تسجيل الدخول</h3>
    <input class="input" id="loginEmail" type="email" placeholder="البريد الإلكتروني">
    <input class="input" id="loginPassword" type="password" placeholder="كلمة المرور">
    <button class="btn" onclick="doLogin()" style="width:100%;padding:12px;margin-top:8px">دخول</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = { id: 'test-user-id' }; // افتراضي مؤقتاً لتسهيل التجربة
let allCars = [
  { id: 1, brand: 'Renault', model: 'Clio 4', year: 2019, price: 2600000, mileage: 75000, wilaya: 'الجزائر', category: 'سياحية', fuel: 'ديزل', gearbox: 'يدوي', is_featured: true, image_url: '' },
  { id: 2, brand: 'Toyota', model: 'Hilux', year: 2022, price: 6500000, mileage: 30000, wilaya: 'وهران', category: 'نفعية', fuel: 'ديزل', gearbox: 'أوتوماتيك', is_featured: false, image_url: '' }
];
let filteredCars = [...allCars];

function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

async function addCar() {
  if(!currentUser){
    openModal("loginModal");
    return;
  }

  const brand = document.getElementById('carBrand').value;
  const model = document.getElementById('carModel').value;
  const price = parseFloat(document.getElementById('carPrice').value);
  const fileInput = document.getElementById('carImageFile');
  
  if (!brand || !model || !price) {
    alert('الرجاء تعبئة الحقول الأساسية');
    return;
  }

  let imageUrl = '';

  if (fileInput && fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const fileExt = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;

    const { data: uploadData, error: uploadError } = await supabase.storage
      .from('car-images')
      .upload(fileName, file);

    if (uploadError) {
      alert('خطأ أثناء رفع الصورة: ' + uploadError.message);
      return;
    }

    const { data: publicURLData } = supabase.storage
      .from('car-images')
      .getPublicUrl(fileName);

    imageUrl = publicURLData.publicUrl;
  }

  const { data, error } = await supabase
    .from('cars')
    .insert([
      { 
        brand: brand, 
        model: model, 
        price: price, 
        image_url: imageUrl,
        user_id: currentUser.id,
        created_at: new Date()
      }
    ]);

  if (error) {
    alert('خطأ أثناء حفظ الإعلان: ' + error.message);
  } else {
    alert('تم بنجاح رفع الصورة ونشر الإعلان!');
    closeModal('addCarModal');
  }
}

function applyFilters() {
  const category = document.getElementById('filterCategory').value;
  const wilaya = document.getElementById('filterWilaya').value;
  const search = document.getElementById('filterSearch').value.toLowerCase().trim();
  const minPrice = parseFloat(document.getElementById('filterMinPrice').value) || 0;
  const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value) || Infinity;

  filteredCars = allCars.filter(car => {
    const matchCategory = !category || car.category === category;
    const matchWilaya = !wilaya || car.wilaya === wilaya;
    const matchSearch = !search || car.brand.toLowerCase().includes(search) || car.model.toLowerCase().includes(search);
    const matchPrice = car.price >= minPrice && car.price <= maxPrice;
    return matchCategory && matchWilaya && matchSearch && matchPrice;
  });

  renderCarsGrid(filteredCars);
}

function renderCarsGrid(carsToRender) {
  const grid = document.getElementById('carsGrid');
  if (!carsToRender || carsToRender.length === 0) {
    grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#64748b; padding:20px;">لا توجد سيارات مطابقة لخيارات البحث.</p>`;
    return;
  }

  grid.innerHTML = carsToRender.map(car => `
    <div class="card ${car.is_featured ? 'featured' : ''}">
      ${car.is_featured ? '<div class="featured-badge">⭐ مميز</div>' : ''}
      <img src="${car.image_url || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=600&q=80'}" alt="${car.brand}">
      <div class="card-body">
        <div class="price">${car.price.toLocaleString()} دج</div>
        <h4 style="font-size:15px; margin:4px 0">${car.brand} ${car.model}</h4>
        <div class="meta">📅 ${car.year || 2023} | 🛣️ ${car.mileage ? car.mileage.toLocaleString() : '0'} كم | 📍 ${car.wilaya || 'الجزائر'}</div>
        <button class="btn" style="width:100%; margin-top:10px; font-size:12px;">تواصل مع البائع</button>
      </div>
    </div>
  `).join('');
}

window.addEventListener('DOMContentLoaded', () => {
  renderCarsGrid(filteredCars);
});
</script>

</body>
</html>
